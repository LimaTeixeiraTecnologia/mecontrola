# OpenTelemetry Collector — GRANDE porte (camada GATEWAY)
# Recebe dos agents e aplica tail_sampling (retém erros e traces lentos) + fila persistente.
# Métricas NÃO passam por tail sampling (são agregadas).
# Deployment recomendado: agents (coleta) -> este gateway (agregação), com múltiplas réplicas atrás de balanceamento.
# Portas OTLP padrão: gRPC 4317, HTTP 4318. Substituir ${OTLP_ENDPOINT} pelo backend real.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    policies:
      - name: erros-sempre
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: latencia-alta
        type: latency
        latency:
          threshold_ms: 500
      - name: amostra-base
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  otlp:
    endpoint: ${OTLP_ENDPOINT}
    tls:
      insecure: false
    sending_queue:
      enabled: true
      num_consumers: 20
      queue_size: 20000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 600s

extensions:
  file_storage:
    directory: /var/lib/otelcol/queue

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp]
