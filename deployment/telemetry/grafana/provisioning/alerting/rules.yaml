apiVersion: 1

groups:
  - orgId: 1
    name: tecnico
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-api-down
        title: API sem métricas
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Sem métricas HTTP da API por mais de 5 minutos."
          description: "A API provavelmente caiu, travou ou parou de exportar métricas. Verifique processo, container e logs recentes. Runbook: deployment/runbooks/rollback.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'absent(http_server_request_active{job="mecontrola-api"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-worker-down
        title: Worker sem heartbeat
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Sem heartbeat do worker por mais de 5 minutos."
          description: "O worker caiu, travou ou parou de exportar métricas. Cobre dois modos de falha: série ausente (processo morto/sem export) e série presente porém congelada (ticker de heartbeat parado com o processo vivo). Verifique processo, container e logs recentes. Runbook: deployment/runbooks/rollback.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'absent(worker_heartbeat{job="mecontrola-worker"}) or (changes(worker_heartbeat{job="mecontrola-worker"}[10m]) == bool 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-api-5xx
        title: Erro 5xx alto na API
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Taxa de respostas 5xx da API acima de 5% por 5 minutos."
          description: "A API esta respondendo com erro em volume anormal. Verifique endpoints com falha, traces e logs recentes. RECONCILIACAO ADR-004 (RF-08): fonte migrada do counter auxiliar http_server_request_count_total para a serie canonica do histograma http_server_request_duration_seconds_count (mesmo histograma ja usado por mc-api-latency-p99). Runbook: deployment/runbooks/rollback.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 * sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[5m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [5] }

      - uid: mc-api-latency-p99
        title: Latência p99 alta na API
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "p99 de latência da API acima de 1 segundo por 10 minutos."
          description: "Ha lentidao sustentada nas requisicoes mais demoradas. Verifique pressao em banco, dependencias externas e endpoints mais lentos."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="mecontrola-api"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [1] }

      - uid: mc-db-pool-wait
        title: Espera por conexão no pool do Postgres
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Pool do Postgres com mais de 1 espera por segundo por 5 minutos."
          description: "A aplicacao esta esperando conexao do banco com frequencia. Verifique saturacao do pool, queries lentas e concorrencia."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(database_pool_wait_count_total{job=~"mecontrola-.+"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [1] }

  - orgId: 1
    name: slo
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-slo-burn-fast
        title: "SLO burn-rate: 14,4x (pagina, 1h+5m)"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Consumo do error budget de disponibilidade a 14,4x (2% do orcamento de 0,1% em 1h, confirmado em 5m)."
          description: "SLO de disponibilidade 99,9% (budget 0,1%, janela 30d, ADR-002/Google SRE Workbook). Consumo agudo do orcamento: nesse ritmo o budget mensal esgota em pouco mais de 2h. SLI = serie canonica do histograma http_server_request_duration_seconds_count (ADR-004), erro filtrado por http_response_status_code=~\"5..\". Verifique endpoints com falha, traces e logs recentes. Runbook: deployment/runbooks/rollback.md."
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[1h])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[1h])), 1)'
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[5m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  query: { params: [A] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.0144] }
                - type: query
                  query: { params: [B] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.0144] }

      - uid: mc-slo-burn-6x
        title: "SLO burn-rate: 6x (pagina, 6h+30m)"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Consumo do error budget de disponibilidade a 6x (5% do orcamento de 0,1% em 6h, confirmado em 30m)."
          description: "SLO de disponibilidade 99,9% (budget 0,1%, janela 30d, ADR-002/Google SRE Workbook). Nesse ritmo o budget mensal esgota em cerca de 5 dias. SLI = serie canonica do histograma http_server_request_duration_seconds_count (ADR-004), erro filtrado por http_response_status_code=~\"5..\". Verifique endpoints com falha, traces e logs recentes. Runbook: deployment/runbooks/rollback.md."
        data:
          - refId: A
            relativeTimeRange: { from: 43200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[6h])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[6h])), 1)'
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[30m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[30m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  query: { params: [A] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.006] }
                - type: query
                  query: { params: [B] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.006] }

      - uid: mc-slo-burn-3x
        title: "SLO burn-rate: 3x (ticket, 1d+2h)"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Consumo do error budget de disponibilidade a 3x (10% do orcamento de 0,1% em 1d, confirmado em 2h)."
          description: "SLO de disponibilidade 99,9% (budget 0,1%, janela 30d, ADR-002/Google SRE Workbook). Degradacao lenta que ainda estoura o orcamento se sustentada. SLI = serie canonica do histograma http_server_request_duration_seconds_count (ADR-004), erro filtrado por http_response_status_code=~\"5..\". Investigar tendencia de erro; nao necessariamente incidente agudo."
        data:
          - refId: A
            relativeTimeRange: { from: 172800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[1d])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[1d])), 1)'
          - refId: B
            relativeTimeRange: { from: 14400, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[2h])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[2h])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  query: { params: [A] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.003] }
                - type: query
                  query: { params: [B] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.003] }

      - uid: mc-slo-burn-1x
        title: "SLO burn-rate: 1x (ticket, 3d+6h)"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Consumo do error budget de disponibilidade a 1x (10% do orcamento de 0,1% em 3d, confirmado em 6h)."
          description: "SLO de disponibilidade 99,9% (budget 0,1%, janela 30d, ADR-002/Google SRE Workbook). Burn rate 1x consome todo o orcamento exatamente ao fim dos 30 dias; sinaliza tendencia sustentada de consumo do budget. SLI = serie canonica do histograma http_server_request_duration_seconds_count (ADR-004), erro filtrado por http_response_status_code=~\"5..\". Investigar tendencia de erro; nao necessariamente incidente agudo."
        data:
          - refId: A
            relativeTimeRange: { from: 518400, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[3d])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[3d])), 1)'
          - refId: B
            relativeTimeRange: { from: 43200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              editorMode: code
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api", http_response_status_code=~"5.."}[6h])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="mecontrola-api"}[6h])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: classic_conditions
              conditions:
                - type: query
                  query: { params: [A] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.001] }
                - type: query
                  query: { params: [B] }
                  reducer: { type: last }
                  operator: { type: and }
                  evaluator: { type: gt, params: [0.001] }

      - uid: mc-slo-latency-p95
        title: Latência P95 acima do SLO (500ms)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "P95 de latência da API acima do SLO de 500ms por 10 minutos."
          description: "SLO de latência P95 < 500ms em janela de 30 dias (RF-04/RF-06). Complementa mc-api-latency-p99 (threshold estático de causa aguda); este alerta liga o sintoma percebido pelo usuário ao SLO formal. Verifique pressão em banco, dependências externas e endpoints mais lentos."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="mecontrola-api"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0.5] }

  - orgId: 1
    name: runtime
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-runtime-goroutine-growth
        title: Crescimento sustentado de goroutines (causa de saturação)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Contagem de goroutines acima do alvo operacional por 15 minutos ou mais em algum processo (api ou worker)."
          description: "Alerta de CAUSA (RF-03), nao de sintoma: crescimento sustentado de go.goroutine.count (serie Prometheus go_goroutine_count, OTel semconv v1.41.0 goconv, contrib/instrumentation/runtime v0.69.0) costuma preceder saturacao de CPU/memoria por goroutine leak (ex.: consumer/producer sem cancelamento, workflow suspenso sem limpeza, goroutine de background sem shutdown cooperativo). Threshold de 3000 e baseline operacional inicial, nao um SLO formal; ajustar apos observar a distribuicao real pos-deploy. Nao pagina isoladamente (severity warning -> email/ticket, ver contact-points.yaml); serve para diagnostico e abertura de ticket. Verifique o painel de runtime do processo (Go) em deployment/dashboards/mecontrola-infra.json e o pprof/goroutine dump do processo indicado no label job. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(go_goroutine_count{job=~"mecontrola-.+"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [3000] }

  # Meta-alertas de presenca de sinal (blindness detection).
  #
  # Motivacao (defeito real, 2026-08-04): quatro alertas ficaram cegos porque a serie que
  # consultavam deixou de existir com o nome esperado (gauge com unidade OTel "1" e renomeado
  # para *_ratio pelo tradutor OTLP->Prometheus). Como esses alertas usam noDataState: OK, a
  # ausencia da serie produz silencio, nao alarme — o modo de falha mais perigoso possivel.
  #
  # O gate `task ci:audit-alert-metrics` cobre isso estaticamente em CI; este grupo cobre em
  # runtime. Cada regra dispara apenas quando a serie sumiu E o processo que a emite esta
  # comprovadamente vivo, evitando duplicar os alertas de queda (mc-api-down/mc-worker-down).
  # Severidade warning (ticket): e defeito de configuracao/regressao, nao incidente de produto.
  - orgId: 1
    name: observabilidade
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-signal-missing-red
        title: "Sinal ausente: serie canonica de RED"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "A serie canonica de RED sumiu enquanto a API continua viva."
          description: "http_server_request_duration_seconds_count deixou de existir com a API ainda emitindo http_server_request_active. Enquanto isso durar, mc-api-5xx, mc-slo-latency-p95 e os quatro alertas de burn-rate estao CEGOS (noDataState: OK = silencio). Causa tipica: mudanca de nome/unidade da metrica ou quebra do pipeline OTLP. Confirme com `task ci:audit-alert-metrics` e compare o nome renderizado no Prometheus. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'absent(http_server_request_duration_seconds_count) and on() (count(http_server_request_active) > 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-signal-missing-runtime
        title: "Sinal ausente: saturacao de runtime Go"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "go_goroutine_count sumiu enquanto api ou worker continuam vivos."
          description: "A instrumentacao de runtime (contrib/instrumentation/runtime) parou de exportar com pelo menos um processo vivo. Enquanto isso durar, mc-runtime-goroutine-growth e os paineis de runtime em mecontrola-infra.json estao CEGOS. Causa tipica: runtimemetrics.Start falhando no bootstrap (ver ErrGlobalMeterProviderNotRegistered) ou RegisterGlobal desativado. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'absent(go_goroutine_count) and on() ((count(http_server_request_active) > 0) or (count(worker_heartbeat) > 0))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-signal-missing-outbox
        title: "Sinal ausente: profundidade da fila do outbox"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "outbox_pending_jobs sumiu enquanto o worker continua vivo."
          description: "O gauge de profundidade da fila deixou de existir com worker_heartbeat presente. Enquanto isso durar, mc-outbox-queue-high esta CEGO. Este e exatamente o defeito de 2026-08-04: unidade OTel \"1\" fez a serie ser publicada como outbox_pending_jobs_ratio. Verifique a unidade em registerOutboxMetrics (cmd/worker/worker.go) e o nome renderizado no Prometheus. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'absent(outbox_pending_jobs) and on() (count(worker_heartbeat) > 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-signal-missing-onboarding
        title: "Sinal ausente: tokens de onboarding nao consumidos"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "onboarding_tokens_paid_unconsumed_overdue sumiu enquanto o worker continua vivo."
          description: "O gauge de tokens pagos nao consumidos deixou de existir com worker_heartbeat presente. Enquanto isso durar, mc-onboarding-unconsumed esta CEGO — e esse alerta cobre receita ja paga sem entrega. Verifique a unidade em internal/onboarding/module.go e o nome renderizado no Prometheus. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'absent(onboarding_tokens_paid_unconsumed_overdue) and on() (count(worker_heartbeat) > 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: infraestrutura
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-disk-usage-high
        title: Uso de disco alto
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Uso de disco acima de 80% por 5 minutos."
          description: "Disco da VPS está próximo da saturação. Verifique logs, métricas e traces; considere housekeeping ou expansão de volume."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} * 100) / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [80] }

      - uid: mc-cpu-usage-high
        title: Uso de CPU alto
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Uso de CPU acima de 70% por 5 minutos."
          description: "CPU da VPS sustentada acima do threshold. Avalie se há processo runaway ou se é hora de upgrade de VPS."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [70] }

      - uid: mc-memory-usage-high
        title: Uso de RAM alto
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Uso de RAM acima de 80% por 5 minutos."
          description: "RAM da VPS próxima da saturação. Verifique containers com alto consumo e risco de OOM kill."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 * (1 - ((node_memory_MemAvailable_bytes or node_memory_MemFree_bytes) / node_memory_MemTotal_bytes))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [80] }

      - uid: mc-wal-lag-high
        title: WAL lag alto no PostgreSQL
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "WAL lag acima de 15 minutos no PostgreSQL."
          description: "pgBackRest ou arquivamento de WAL está atrasado. Risco de PITR comprometido; verifique conectividade S3 e processo de archive-push. Runbook: deployment/runbooks/backup-schedule.md."
        data:
          - refId: A
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(
  pg_stat_archiver_last_archive_age > 900
  and on()
  (
    rate(pg_stat_database_xact_commit[10m]) > 0
    or
    rate(pg_stat_database_blks_written[10m]) > 0
  )
)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [900] }

      # RECONCILIACAO ADR-003 (RF-07/RF-20): alerta "mc-outbox-queue-high" RESTAURADO.
      # A remocao anterior partiu de premissa factualmente errada ("metrica nunca emitida",
      # baseada em grep restrito a internal/platform/outbox/). A metrica E emitida em
      # cmd/worker/worker.go (registerOutboxMetrics). O sintoma de "serie ausente" vinha do
      # sufixo `_ratio` aplicado pelo tradutor OTLP->Prometheus a gauges com unit "1";
      # corrigido na origem trocando a unit para a anotacao `{job}` (nome renderizado volta a
      # ser `outbox_pending_jobs`, confirmado empiricamente contra grafana/otel-lgtm:0.7.5).
      - uid: mc-outbox-queue-high
        title: Fila de jobs outbox alta
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Fila de jobs outbox acima de 1000 por 5 minutos."
          description: "Workers não estão acompanhando a produção de eventos. Verifique saúde dos workers, latência de handlers e disponibilidade de banco. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(outbox_pending_jobs)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [1000] }

      - uid: mc-outbox-dead-letter
        title: Evento em dead-letter no outbox
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Evento do outbox atingiu max_attempts e foi promovido a dead-letter (status=4)."
          description: "Side-effect pode ter sido perdido. Verificar: SELECT id, event_type, attempts, last_error FROM mecontrola.outbox_events WHERE status = 4; decidir reprocessar ou descartar com registro auditável. Runbook: docs/runbooks/deploy-anti-storm.md"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'increase(outbox_dead_letter_total[5m])'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-tracing-spans-absent
        title: Pipeline de tracing sem spans
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Nenhum span chegou ao OpenTelemetry Collector nos ultimos 30 minutos."
          description: "Baseline saudavel e ~1.4 spans/s continuos (jobs instrumentados). Ausencia total indica collector/Tempo indisponivel ou exportadores quebrados em todos os servicos. Verificar saude do otel-lgtm e conectividade OTLP (4317/4318) a partir dos containers."
        data:
          - refId: A
            relativeTimeRange: { from: 2700, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(otelcol_receiver_accepted_spans[30m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: lt, params: [0.01] }

      - uid: mc-tracing-export-failed
        title: Falha ao exportar spans para o Tempo
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "OpenTelemetry Collector esta falhando ao exportar spans para o backend de tracing."
          description: "Spans aceitos mas nao exportados: traces estao sendo perdidos. Verificar Tempo, recursos do otel-lgtm (memoria/queue) e otelcol_exporter_queue_size."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'increase(otelcol_exporter_send_failed_spans[10m])'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: negocio
    folder: MeControla Alerts
    interval: 5m
    rules:
      - uid: mc-onboarding-unconsumed
        title: Tokens pagos sem consumo no onboarding
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Tres ou mais tokens pagos seguem sem ativacao por mais de 15 minutos."
          description: "Ha acumulacao sustentada de clientes pagos sem ativacao. Verifique fluxo de ativacao, entrega de email, WhatsApp, eventos outbox e consumo de tokens. Casos isolados ficam no dashboard sem notificar."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(onboarding_tokens_paid_unconsumed_overdue)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [2] }

  - orgId: 1
    name: plataforma
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-collector-export-fail
        title: Falha na exportação de métricas do collector
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Collector falhando ao exportar metricas por 5 minutos."
          description: "O otelcol nao esta conseguindo enviar metricas ao Prometheus de forma continua. Verifique conectividade, filas internas e logs do collector. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(otelcol_exporter_send_failed_metric_points_total[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: agente
    folder: MeControla Alerts
    interval: 1m
    rules:
      # RECONCILIACAO ADR-003 (RF-07/RF-20): alerta "mc-agent-parse-unknown" removido.
      # `agent_intent_parsed_total` (com labels outcome=provider_error/fallback_*) e
      # heranca do parser de intent do `internal/agent` descontinuado (emenda 2026-06-29).
      # O agente atual (`internal/agents`, `internal/platform/agent`) roteia por tool-calling
      # loop, sem esse conceito de outcome de parsing; nao ha metrica viva equivalente com a
      # mesma taxonomia de causa. Confirmado por `grep` no codigo: 0 ocorrencias.

      # RECONCILIACAO ADR-003 (RF-07/RF-20): alerta "mc-agent-fallback-exhausted" removido.
      # `agent_llm_fallback_exhausted_total` referenciava uma cadeia de fallback entre
      # providers LLM que nao existe mais: OpenRouter e o unico provider sancionado
      # (R-AGENT-WF-001.4), sem fallback chain nem circuit breaker. A taxa de erro do
      # provider LLM ja e coberta, com metrica viva, pelo alerta "mc-agent-llm-error-rate"
      # abaixo (`agent_llm_provider_errors_total` / `agent_llm_provider_call_total`,
      # emitidos em internal/platform/llm/openrouter.go). Confirmado por `grep`: 0 ocorrencias.

      - uid: mc-agent-llm-error-rate
        title: Taxa de erro dos providers LLM alta
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Taxa de erro dos providers LLM acima de 20%."
          description: "Ver reason em agent_llm_provider_errors_total (timeout/rate_limited/upstream_5xx/no_credit). Verifique disponibilidade do OpenRouter."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 * sum(rate(agent_llm_provider_errors_total{job="mecontrola-api"}[10m])) / clamp_min(sum(rate(agent_llm_provider_call_total{job="mecontrola-api"}[10m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [20] }

      # RECONCILIACAO ADR-003 (RF-07/RF-20): alerta "mc-agent-policy-block-rate" removido.
      # `agent_policy_blocks_total` e `agent_intent_routed_total` sao heranca da politica de
      # confianca (AGENT_POLICY_MIN_CONFIDENCE) do parser de intent do `internal/agent`
      # descontinuado. O agente atual nao possui esse gate de confianca sobre um score de
      # parsing; nao ha metrica viva equivalente. Confirmado por `grep`: 0 ocorrencias.

      - uid: mc-agent-idempotency-replay
        title: Replays idempotentes acima do esperado
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Replays idempotentes acima do esperado."
          description: "Reentrega de webhook ou tentativa de duplicacao elevada. Confirme que o guard evita dupla execucao; investigue origem das mensagens repetidas. RECONCILIACAO ADR-003: migrado de `agent_idempotency_replay_total` (0 ocorrencias no codigo atual) para `agents_write_total{outcome=\"replay\"}`, emitido em internal/agents/application/usecases/idempotent_write.go."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(agents_write_total{job="mecontrola-api", outcome="replay"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [1] }

      - uid: mc-agent-guard-false-success-blocked
        title: Guard bloqueou confirmacao fabricada pelo LLM
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Guard de escrita bloqueou confirmacao/categoria fabricada pelo LLM sem tool call."
          description: "Cada bloqueio e um falso positivo evitado, mas o usuario recebeu mensagem de falha. Investigar o run (campo error com prefixo 'guard <nome>:'), os argumentos do tool call e a conformidade do modelo com o system prompt. Se recorrente para o mesmo guard, revisar prompt ou promover o caminho para shortcut deterministico."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(increase(agent_guard_decisions_total{decision="handled", guard=~"success_without_tool|confirmation_without_tool|category_without_tool"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: pool
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-pgbouncer-pool-saturation
        title: Saturacao de pool pgBouncer
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Conexoes reais ao Postgres acima de 80% do MAX_DB_CONNECTIONS (30)."
          description: "pgBouncer esta proximo do teto de conexoes reais. Pressao de pool sustentada pode causar timeouts de query. Verifique DB_MAX_CONNS dos processos, background jobs e queries lentas que seguram conexoes. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'pg_stat_database_numbackends{datname="mecontrola_db"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [24] }

      - uid: mc-pgbouncer-client-queue
        title: Espera no pool da aplicacao (app -> pgbouncer) alta
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Pool database/sql da aplicacao com espera acima de 2 por segundo por 3 minutos."
          description: "Metrica database_pool_wait_count_total mede o pool database/sql da propria aplicacao (app -> pgbouncer), NAO o cl_waiting interno do pgBouncer. Processos da aplicacao aguardam conexao com frequencia elevada. Verifique DB_MAX_CONNS/pool da app, DEFAULT_POOL_SIZE do pgBouncer e queries longas. Gatilho de upgrade: pool wait > 5/s sustentado por 10 min."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(rate(database_pool_wait_count_total{job=~"mecontrola-.+"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [2] }

  - orgId: 1
    name: backup
    folder: MeControla Alerts
    interval: 5m
    rules:
      - uid: mc-backup-full-stale
        title: Backup full pgBackRest atrasado ou desatualizado
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Backup full semanal esperado atrasado ou ultimo full com mais de 8 dias."
          description: "O full semanal nao foi concluido apos a janela de tolerancia, ou o ultimo full esta desatualizado. PITR comprometido. Verifique cron de backup full, conectividade S3 e logs do pgBackRest. Runbook: deployment/runbooks/restore-pitr.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(max(pgbackrest_backup_expected_late{type="full"}) + max(pgbackrest_backup_age_seconds{type="full"} > bool 691200)) * on() (max(pgbackrest_info_failed) == bool 0)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-backup-diff-stale
        title: Backup diff pgBackRest esperado atrasado
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Backup diff esperado do pgBackRest esta atrasado."
          description: "O diff esperado pelo calendario nao foi concluido apos a janela de tolerancia. Domingo executa full e nao deve gerar falso positivo de diff. Verifique timer/cron de backup diff e logs do pgBackRest."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pgbackrest_backup_expected_late{type="diff"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-backup-archive-push-failed
        title: Archive-push do pgBackRest falhando
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "pgBackRest check detectou falha de archive-push."
          description: "O archive-push de WAL esta falhando (pgbackrest check retornou erro). PITR comprometido; WAL nao esta chegando ao repositorio. Verifique conectividade S3, credenciais e processo de archive_command. Runbook: deployment/runbooks/restore-pitr.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pgbackrest_archive_push_failed)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-backup-info-failed
        title: Coleta pgBackRest info falhando
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Exporter nao conseguiu executar pgbackrest info."
          description: "A idade dos backups pode estar indisponivel ou com sentinela. Verifique container postgres, stanza, credenciais e logs do pgBackRest. Runbook: deployment/runbooks/backup-schedule.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(pgbackrest_info_failed)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

      - uid: mc-backup-metrics-stale
        title: Metricas pgBackRest desatualizadas
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Textfile collector sem metricas pgBackRest recentes."
          description: "A ultima coleta pgBackRest tem mais de 1 hora ou a serie esta ausente. Verifique pgbackrest-metrics.timer/cron, node_exporter e permissao do textfile collector. Runbook: deployment/runbooks/backup-schedule.md."
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'max(time() - pgbackrest_metrics_collected_timestamp_seconds)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [3600] }

  # Agente de audio WhatsApp/STT (RF-28/RF-29, prd-agente-audio-openrouter, tarefa 9.0).
  #
  # Metricas emitidas em internal/agents/application/usecases/process_audio_inbound.go, labels
  # de baixa cardinalidade (provider/model/outcome/reason/mime_family/channel). Nenhum label
  # carrega user_id, wamid, media_id, telefone ou transcricao (RF-27/RF-28).
  #
  # AudioEnabled=false por default (configs/config.go): antes da habilitacao em producao estes
  # alertas ficam em noDataState: OK (silencio esperado, sem trafego de audio). Runbook completo:
  # deployment/runbooks/audio-whatsapp-stt.md.
  - orgId: 1
    name: audio
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-audio-stt-error-rate
        title: "stt_error_rate_15m acima de 5%"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Taxa de falha de transcricao STT (outcome=transcription_failed) acima de 5% em 15 minutos."
          description: "RF-29 (techspec prd-agente-audio-openrouter): threshold inicial stt_error_rate_15m > 5%. Fonte: agents_audio_inbound_total{outcome=\"transcription_failed\"} sobre o total de agents_audio_inbound_total na mesma janela. Nao expõe wamid/media_id/transcricao. Runbook: deployment/runbooks/audio-whatsapp-stt.md#falha-stt."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 * sum(rate(agents_audio_inbound_total{outcome="transcription_failed"}[15m])) / clamp_min(sum(rate(agents_audio_inbound_total[15m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [5] }

      - uid: mc-audio-transcription-uncertain-rate
        title: "transcription_uncertain_rate_15m acima de 20%"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Taxa de incerteza tecnica de transcricao (outcome=transcription_uncertain) acima de 20% em 15 minutos."
          description: "RF-29: threshold inicial transcription_uncertain_rate_15m > 20%. Fonte: agents_audio_inbound_total{outcome=\"transcription_uncertain\"} sobre o total de agents_audio_inbound_total na mesma janela. Incerteza alta e sintoma tecnico (idioma, confianca, truncamento), nao falha de infraestrutura; nao dispara tool call nem HandleInbound por design (decisor DecideAudioTranscription). Runbook: deployment/runbooks/audio-whatsapp-stt.md#incerteza-tecnica-alta."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '100 * sum(rate(agents_audio_inbound_total{outcome="transcription_uncertain"}[15m])) / clamp_min(sum(rate(agents_audio_inbound_total[15m])), 1)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [20] }

      - uid: mc-audio-transcription-latency-p95
        title: "transcription_p95_15m acima de 8s"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "p95 de latencia de transcricao STT acima de 8 segundos em 15 minutos."
          description: "RF-29: threshold inicial transcription_p95_15m > 8s (STTTimeout default AGENT_STT_TIMEOUT=20s). Fonte: histograma agents_audio_transcription_latency_seconds. Benchmark real (30 audios, benchmark-stt.md) mediu p95 775ms; alerta cobre degradacao sustentada de OpenRouter/rede acima do orcamento de latencia da techspec. Runbook: deployment/runbooks/audio-whatsapp-stt.md#latencia-alta."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(agents_audio_transcription_latency_seconds_bucket[15m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [8] }

      - uid: mc-audio-cost-microusd-high
        title: "audio_cost_microusd_1h acima de 120000"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Custo acumulado de STT acima de 120000 microusd (0.12 USD) em 1 hora."
          description: "RF-29: threshold inicial audio_cost_microusd_1h > 120000, equivalente a 60 audios no teto por-audio AGENT_AUDIO_MAX_COST_MICROUSD=2000 (techspec, secao Configuracao). Fonte: increase(agents_audio_cost_microusd_total[1h]). Qualquer aumento deste threshold exige decisao operacional versionada antes do deploy (techspec, Alertas iniciais). Runbook: deployment/runbooks/audio-whatsapp-stt.md#custo-alto."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(increase(agents_audio_cost_microusd_total[1h]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [120000] }

      - uid: mc-audio-false-success
        title: "audio_false_success acima de 0"
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Confirmacao positiva sem recurso duravel apos texto canonico originado de audio."
          description: "RF-29: threshold audio_false_success > 0 (golden ou canary). Audio so gera texto canonico aprovado (AudioOutcomeApproved) e entra no MESMO pipeline textual existente (tools/workflows financeiros); nao ha metrica dedicada por origem audio/texto (adicionar label de origem em metrica de mutacao violaria o contrato de labels da techspec). Por isso este alerta reusa a familia generica ja provisionada agents_*_false_success_total (transaction-write, card-manage, budget-manage), a MESMA fonte do alerta FinancialWriteFalseSuccess (docs/alerts/mecontrola-agent-gate-posdeploy.yaml). Em golden set, o mesmo invariante e verificado offline e determinado com tolerancia 0 por TestInvariantNoFalseSuccessOnAudioOriginatedRun (tarefa 8.0). Runbook: deployment/runbooks/audio-whatsapp-stt.md#regressao-golden-e-falso-sucesso."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'sum(increase({__name__=~"agents_.+_false_success_total"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: disco
    folder: MeControla Alerts
    interval: 1m
    rules:
      - uid: mc-disk-low-bytes
        title: Disco com menos de 10 GiB livres
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Disco da VPS com menos de 10 GiB livres por 5 minutos."
          description: "Espaco absoluto em disco critico. Execute docker-prune.sh imediatamente e verifique logs, build cache e imagens antigas. Referencia: deployment/scripts/docker-prune.sh. Runbook: docs/runbooks/infra-saturation-triage.md."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: lt, params: [10737418240] }

  - orgId: 1
    name: openrouter
    folder: MeControla Alerts
    interval: 5m
    rules:
      - uid: mc-openrouter-credit-low
        title: Crédito OpenRouter para menos de 5 dias
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Saldo de creditos do OpenRouter cobre menos de 5 dias de uso no ritmo medio semanal."
          description: "Projecao = openrouter_credits_remaining_usd / (openrouter_usage_weekly_usd / 7), com piso de USD 0,05/dia no denominador para nao disparar quando o gasto semanal e desprezivel. Ritmo calculado sobre a semana (usage_daily zera no inicio do dia e geraria projecao falsa). Avaliar recarga em https://openrouter.ai/credits. Runbook: docs/runbooks/openrouter-credits.md."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'openrouter_credits_remaining_usd / clamp_min(openrouter_usage_weekly_usd / 7, 0.05)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: lt, params: [5] }

      - uid: mc-openrouter-credit-critical
        title: Crédito OpenRouter abaixo de US$ 2,50
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Saldo de creditos do OpenRouter abaixo de USD 2,50 por 30 minutos."
          description: "Piso absoluto independente do ritmo de gasto: sem recarga imediata as chamadas de LLM (chat e STT) comecam a falhar por falta de credito. Recarregar em https://openrouter.ai/credits. Runbook: docs/runbooks/openrouter-credits.md."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: 'openrouter_credits_remaining_usd'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: lt, params: [2.5] }

      - uid: mc-openrouter-credits-stale
        title: Métricas de crédito OpenRouter desatualizadas
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "Sem consulta bem-sucedida a API de creditos do OpenRouter ha mais de 6 horas."
          description: "O monitor do worker (poll a cada 15 minutos) nao obtem sucesso na API de creditos do OpenRouter ha mais de 6 horas, ou a serie nao existe. Os alertas de saldo podem estar cegos. Verifique openrouter_credits_scrape_errors_total, logs do worker e conectividade com openrouter.ai. Runbook: docs/runbooks/openrouter-credits.md."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              instant: true
              expr: '(time() - max(openrouter_credits_last_success_timestamp_seconds) > 6 * 3600) or absent(openrouter_credits_last_success_timestamp_seconds)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  reducer: { type: last }
                  operator: { type: and }
                  query: { params: [C] }
                  evaluator: { type: gt, params: [0] }
